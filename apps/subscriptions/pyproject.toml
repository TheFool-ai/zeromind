[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "zeromind-subscriptions"
version = "0.1.0"
description = "ZeroMind 订阅领域与持久化"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2.0.36,<2.1",
  "alembic>=1.14,<2",
  "aiosqlite>=0.20,<1",
  "psycopg[binary]>=3.2,<4",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "defusedxml>=0.7.1,<1",
]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1", "httpx>=0.27,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/subscription_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
