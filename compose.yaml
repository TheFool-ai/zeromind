name: zeromind

x-backend: &backend
  build:
    context: .
    dockerfile: apps/information/Dockerfile
  env_file:
    - path: .env
      required: false
  environment:
    ZEROMIND_ENVIRONMENT: production
    ZEROMIND_DATABASE_URL: postgresql+psycopg://zeromind:${POSTGRES_PASSWORD:-zeromind}@postgres:5432/zeromind
    ZEROMIND_REDIS_URL: redis://redis:6379/0
    ZEROMIND_RSSHUB_PRIVATE_HOSTS: ${ZEROMIND_RSSHUB_PRIVATE_HOSTS:-rsshub}
    ZEROMIND_PI_COMMAND: node /app/pi-runner/dist/main.js
    ZEROMIND_ADMIN_USERNAME: ${ZEROMIND_ADMIN_USERNAME:-admin}
    ZEROMIND_ADMIN_PASSWORD: ${ZEROMIND_ADMIN_PASSWORD:-change-me}
    ZEROMIND_TOKEN_SECRET: ${ZEROMIND_TOKEN_SECRET:-replace-with-a-random-secret}
    ZEROMIND_CREDENTIAL_SECRET: ${ZEROMIND_CREDENTIAL_SECRET:-replace-with-another-random-secret}
    GLM_API_KEY: ${GLM_API_KEY:-}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zeromind
      POSTGRES_USER: zeromind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zeromind}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeromind -d zeromind"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rsshub:
    image: diygod/rsshub:latest
    environment:
      NODE_ENV: production
      CACHE_TYPE: redis
      REDIS_URL: redis://redis:6379/1
      TWITTER_AUTH_TOKEN: ${TWITTER_AUTH_TOKEN:-}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1200/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    command: ["uvicorn", "zeromind.bootstrap.app:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    <<: *backend
    command:
      [
        "celery",
        "-A",
        "zeromind.bootstrap.celery:celery_app",
        "worker",
        "--loglevel=INFO",
        "--queues=feeds,events,scheduler",
        "--concurrency=2",
      ]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  scheduler:
    <<: *backend
    command:
      [
        "celery",
        "-A",
        "zeromind.bootstrap.celery:celery_app",
        "beat",
        "--loglevel=INFO",
      ]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    build:
      context: apps/web
      dockerfile: Dockerfile
    ports:
      - "${ZEROMIND_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
